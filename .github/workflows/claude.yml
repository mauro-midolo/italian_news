name: Edizione giornaliera

on:
  workflow_dispatch:

concurrency:
  group: edizione-giornaliera
  cancel-in-progress: true

jobs:
  edizione:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    env:
      # Secondi di attesa prima della notifica Telegram: servono a dare tempo
      # a Cloudflare Pages di pubblicare il commit. Da alzare a mano una volta
      # misurata la durata reale del deploy.
      ATTESA_DEPLOY_SECONDI: 2
      SITO_URL: https://news.mauromidolo.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepara public/ a partire dal template
        run: |
          # L'edizione di ieri resta a disposizione dell'agente per evitare
          # di ripetere le stesse notizie e gli stessi avvisi.
          mkdir -p .cache
          if [ -f public/index.html ]; then
            cp public/index.html .cache/edizione-precedente.html
          fi

          # public/ riparte sempre da una copia pulita del template: cosi'
          # CSS, JS e asset restano allineati senza che l'agente li riscriva.
          rm -rf public
          cp -R template public

      - name: Genera l'edizione con Claude
        uses: anthropics/claude-code-action@v1.0.216
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Sei il redattore automatico de "Il Quotidiano", il giornale
            personale di questo repository. Oggi è il giorno restituito dal
            comando `date` sulla macchina (fuso Europe/Rome).

            Il tuo unico compito è scrivere `public/index.html`: l'edizione
            di oggi, completa e pronta per la pubblicazione.

            ## Passi

            1. Leggi `CLAUDE.md`: contiene il contratto di generazione completo.
            2. Leggi `details.info`: definisce che cosa deve contenere il
               giornale. È l'unica fonte di verità sui contenuti.
            3. Leggi `template/index.html` e `template/css/style.css`: sono la
               struttura e la grafica da rispettare alla lettera.
            4. Se esiste `.cache/edizione-precedente.html`, leggilo: è
               l'edizione di ieri. Serve a non ripubblicare le stesse notizie
               e a non ripetere ogni giorno lo stesso avviso.
            5. Cerca sul web i contenuti richiesti e verifica le condizioni
               configurate.
            6. Scrivi `public/index.html`.

            ## Sezione [NOTIZIE]

            Ogni voce elencata sotto `[NOTIZIE]` in `details.info` produce un
            riquadro `<section class="riquadro">` dentro `.griglia`, nello
            stesso ordine del file, con il titolo della voce come intestazione.
            Da 3 a 8 notizie per riquadro, delle ultime 24-48 ore, ordinate
            per rilevanza, ciascuna con titolo, riassunto di 2-4 frasi e link
            alla fonte originale.

            Non dare per scontate le categorie: leggi le voci effettivamente
            presenti nel file, quali che siano.

            ## Sezione [INFORMAZIONI]

            Ogni voce è una condizione da verificare, NON un contenuto da
            mostrare per forza.

            - Se dalla verifica non emerge nulla da comunicare, ometti
              completamente la sezione `<section class="avvisi">`. Non scrivere
              messaggi del tipo "non ancora disponibile": la pagina deve
              semplicemente chiudersi senza spazi vuoti.
            - Se una condizione risulta soddisfatta, o emerge un'informazione
              rilevante, inserisci `.avvisi` in cima al `<main>`, PRIMA delle
              notizie, con un `<article class="avviso">` per ciascuna novità:
              titolo sintetico, spiegazione breve, richiesta monitorata e fonte.
            - Se ieri avevi già dato lo stesso avviso e la situazione non è
              cambiata, non ripeterlo.

            ## Vincoli tecnici

            - Modifica SOLO `public/index.html`. Non toccare `template/`,
              `details.info`, `CLAUDE.md` o i file già copiati in `public/`
              (CSS, JS, asset): sono già allineati.
            - Rimuovi l'attributo `data-edizione="TEMPLATE-DEMO"` dal tag
              `<html>`: la pipeline fallisce se lo trova.
            - Aggiorna `<title>`, `<meta name="description">`, `og:title`,
              `og:description`, il `<time datetime="AAAA-MM-GG">` con la data
              estesa in italiano e il `datetime` di `data-ruolo="aggiornato"`.
            - Non cambiare nomi di classi, percorsi degli asset né la struttura
              del template. Lascia gli attributi `hidden` dove li trovi.
            - Non eseguire comandi git.

            ## Regole redazionali

            - Italiano, tono sobrio e informativo.
            - Riassumi con parole tue: niente virgolettati estesi o copia-incolla.
            - Cita solo notizie che hai davvero trovato, con la fonte reale.
              Non inventare NULLA: se le notizie locali scarseggiano, scrivine
              meno.
            - Registro neutrale sui temi politicamente controversi.
            - Niente calcio, a meno che non si tratti dei mondiali.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 120
            --allowedTools "WebSearch,WebFetch,Read,Write,Edit,Glob,Grep,Bash(date*)"

      - name: Verifica l'edizione generata
        run: |
          set -e

          test -f public/index.html || { echo "::error::public/index.html non è stato generato."; exit 1; }

          if grep -q "TEMPLATE-DEMO" public/index.html; then
            echo "::error::public/index.html è ancora il template di esempio."
            exit 1
          fi

          if ! grep -q 'class="riquadro"' public/index.html; then
            echo "::error::l'edizione non contiene alcun riquadro di notizie."
            exit 1
          fi

          oggi="$(TZ='Europe/Rome' date +%Y-%m-%d)"
          if ! grep -q "$oggi" public/index.html; then
            echo "::error::l'edizione non riporta la data di oggi ($oggi)."
            exit 1
          fi

          # CSS, JS e asset devono restare identici al template.
          for file in css/style.css js/main.js assets/favicon.svg _headers robots.txt; do
            diff -q "template/$file" "public/$file" > /dev/null \
              || { echo "::error::public/$file diverge dal template."; exit 1; }
          done

          echo "Edizione valida: $(grep -c 'class="notizia"' public/index.html || true) notizie."

      - name: Pubblica l'edizione
        id: pubblica
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public
          if git diff --staged --quiet; then
            echo "Nessuna modifica da pubblicare."
            echo "pubblicata=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Edizione del $(TZ='Europe/Rome' date +%d/%m/%Y)"
            git push
            echo "pubblicata=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Avvisa su Telegram
        if: steps.pubblica.outputs.pubblicata == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_CHAT: ${{ secrets.TELEGRAM_BOT_CHAT }}
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_BOT_CHAT:-}" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN o TELEGRAM_BOT_CHAT non configurati: notifica saltata."
            exit 0
          fi

          # Attesa per lasciare a Cloudflare Pages il tempo di pubblicare.
          echo "Attendo ${ATTESA_DEPLOY_SECONDI}s prima di notificare..."
          sleep "${ATTESA_DEPLOY_SECONDI}"

          messaggio="La rassegna del $(TZ='Europe/Rome' date +%d/%m/%Y) e' pronta: ${SITO_URL}"

          curl -sS --fail-with-body -o /dev/null \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_BOT_CHAT}" \
            --data-urlencode "text=${messaggio}" \
            --data-urlencode "disable_web_page_preview=false"

          echo "Notifica Telegram inviata."


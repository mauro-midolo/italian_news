name: Edizione giornaliera

on:
  workflow_dispatch:

concurrency:
  group: edizione-giornaliera
  cancel-in-progress: true

jobs:
  edizione:
    runs-on: ubuntu-latest
    # Due tentativi di generazione (~15 minuti l'uno nei casi peggiori) piu'
    # l'attesa del deploy prima della notifica.
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
    env:
      # Secondi di attesa prima della notifica Telegram: servono a dare tempo
      # a Cloudflare Pages di pubblicare il commit. Da alzare a mano una volta
      # misurata la durata reale del deploy.
      ATTESA_DEPLOY_SECONDI: 60
      SITO_URL: https://news.mauromidolo.com

      # Il prompt vive qui perche' viene usato due volte: alla prima
      # generazione e al tentativo di recupero.
      PROMPT_EDIZIONE: |
        Sei il redattore automatico de "Il Quotidiano", il giornale
        personale di questo repository. Oggi è il giorno restituito dal
        comando `date` sulla macchina (fuso Europe/Rome).

        Il tuo compito è riempire `public/index.html` con l'edizione di oggi.

        ## Da dove parti

        `public/index.html` NON è una copia del template: è già lo scheletro
        dell'edizione di oggi, preparato dalla pipeline. Ha la testata con la
        data corretta, i metadati aggiornati, nessun contenuto di esempio e
        una griglia vuota:

            <div class="griglia">
              <!-- I riquadri delle notizie vanno inseriti qui, ... -->
            </div>

        Non riscriverlo da zero e non ricopiarci dentro `template/index.html`:
        va riempito, non rifatto.

        ## Metodo obbligatorio: un riquadro alla volta

        Lavora una categoria alla volta e SCRIVI SUBITO ogni riquadro appena
        l'hai finito, con una Edit che lo inserisce dentro `.griglia`, prima
        di passare alla categoria successiva.

        Non accumulare il lavoro per scriverlo tutto alla fine: se il turno si
        interrompe, quello che hai già scritto su disco viene pubblicato,
        quello che hai solo in memoria è perso. Una pagina con metà dei
        riquadri è un'edizione ridotta; una pagina vuota è un giorno saltato.

        Per ogni voce di `[NOTIZIE]` in `details.info`, nell'ordine del file:

        1. cerca sul web le notizie di quella categoria (ultime 24-48 ore);
        2. inserisci subito in `.griglia`, in fondo, il riquadro corrispondente;
        3. passa alla voce successiva.

        Non dare per scontate le categorie: leggi le voci effettivamente
        presenti nel file, quali che siano. Se ne compare una nuova, produce un
        riquadro nuovo senza bisogno di altro.

        Tieni traccia dell'avanzamento con TodoWrite: una voce per categoria,
        così a metà lavoro sai sempre quali mancano.

        ## Passi

        1. Leggi `CLAUDE.md`: contiene il contratto di generazione completo.
        2. Leggi `details.info`: definisce che cosa deve contenere il
           giornale. È l'unica fonte di verità sui contenuti.
        3. Leggi `public/index.html` (lo scheletro) e, se ti serve un esempio
           di markup, `template/index.html`.
        4. Se esiste `.cache/edizione-precedente.html`, leggilo: è
           l'edizione di ieri. Serve a non ripubblicare le stesse notizie
           e a non ripetere ogni giorno lo stesso avviso.
        5. Categoria per categoria: cerca, scrivi il riquadro, prosegui.
        6. Alla fine verifica le condizioni di `[INFORMAZIONI]`.

        ## Struttura di un riquadro

            <section class="riquadro">
              <header class="riquadro__testata">
                <h3 class="riquadro__titolo">Titolo della voce di [NOTIZIE]</h3>
                <span class="riquadro__conteggio" data-ruolo="conteggio"></span>
              </header>

              <article class="notizia">
                <h4 class="notizia__titolo">Titolo della notizia</h4>
                <p class="notizia__testo">Riassunto di 2-4 frasi, parole tue.</p>
                <p class="notizia__meta">
                  <a class="notizia__fonte" href="URL REALE" rel="noopener">Nome della fonte</a>
                </p>
              </article>
            </section>

        Da 3 a 8 notizie per riquadro, ordinate per rilevanza. Lo `<span>`
        con `data-ruolo="conteggio"` va lasciato vuoto: lo riempie il
        JavaScript.

        ## Sezione [INFORMAZIONI]

        Ogni voce è una condizione da verificare, NON un contenuto da
        mostrare per forza.

        - Se dalla verifica non emerge nulla da comunicare, non aggiungere
          niente: lo scheletro non contiene la sezione `.avvisi` proprio
          perché il caso normale è che non ci sia nulla da segnalare. Non
          scrivere messaggi del tipo "non ancora disponibile".
        - Se una condizione risulta soddisfatta, o emerge un'informazione
          rilevante, inserisci `.avvisi` in cima al `<main>`, PRIMA della
          sezione delle notizie, con un `<article class="avviso">` per
          ciascuna novità: titolo sintetico, spiegazione breve, richiesta
          monitorata e fonte.
        - Se ieri avevi già dato lo stesso avviso e la situazione non è
          cambiata, non ripeterlo.

        ## Vincoli tecnici

        - Modifica SOLO `public/index.html`. Non toccare `template/`,
          `details.info`, `CLAUDE.md` o i file già copiati in `public/`
          (CSS, JS, asset): sono già allineati.
        - Non reintrodurre l'attributo `data-edizione` sul tag `<html>` e non
          lasciare link a `esempio.it`: la pipeline fallisce se li trova.
        - La testata è già a posto: data, `<title>`, `<meta>` e `og:` sono
          stati compilati dalla pipeline con la data di oggi. Non toccarli.
        - Non cambiare nomi di classi, percorsi degli asset né la struttura
          della pagina. Lascia gli attributi `hidden` dove li trovi.
        - Non eseguire comandi git.

        ## Se qualcosa va storto

        - Se una ricerca web fallisce, una fonte non risponde o un sito
          blocca la lettura, riprova una volta; se continua a non
          funzionare passa oltre e scrivi comunque il riquadro con le
          notizie che hai trovato, o con meno notizie del previsto.
        - Se una categoria non dà proprio nulla, saltala e vai alla
          successiva: il riquadro mancante è meglio di un riquadro inventato.
        - Non chiedere conferme e non fermarti a chiedere istruzioni:
          nessuno può risponderti, il job gira senza supervisione.
        - Non chiudere il turno con un riassunto di quello che avresti
          scritto: quello che conta è solo ciò che è finito dentro
          `public/index.html`.

        ## Controllo finale

        Prima di considerare finito il lavoro rileggi `public/index.html` e
        verifica che ci sia un `<section class="riquadro">` per ogni voce di
        `[NOTIZIE]` che ha prodotto risultati, che non compaia la stringa
        `data-edizione` e che nessun link punti a `esempio.it`.

        ## Regole redazionali

        - Italiano, tono sobrio e informativo.
        - Riassumi con parole tue: niente virgolettati estesi o copia-incolla.
        - Cita solo notizie che hai davvero trovato, con la fonte reale.
          Non inventare NULLA: se le notizie locali scarseggiano, scrivine
          meno.
        - Registro neutrale sui temi politicamente controversi.
        - Niente calcio, a meno che non si tratti dei mondiali.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepara public/ a partire dal template
        run: |
          set -euo pipefail

          # L'edizione di ieri resta a disposizione dell'agente per evitare
          # di ripetere le stesse notizie e gli stessi avvisi.
          mkdir -p .cache
          if [ -f public/index.html ]; then
            cp public/index.html .cache/edizione-precedente.html
          fi

          .github/scripts/prepara-public.sh

      - name: Genera l'edizione con Claude
        uses: anthropics/claude-code-action@v1.0.222
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ env.PROMPT_EDIZIONE }}
          claude_args: |
            --model claude-sonnet-5
            --max-turns 500
            --allowedTools "WebSearch,WebFetch,Read,Write,Edit,Glob,Grep,TodoWrite,Bash(date*)"

      # Controllo morbido: se l'agente ha chiuso senza scrivere l'edizione
      # (capita quando una ricerca va male e si ferma dopo pochi turni) si
      # riparte da capo invece di far fallire la giornata.
      - name: Verifica il primo tentativo
        id: primo_controllo
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .cache
          .github/scripts/verifica-edizione.sh 2>&1 | tee .cache/esito-controllo.txt

      - name: Prepara il secondo tentativo
        if: steps.primo_controllo.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning::primo tentativo incompleto: si riprova."

          # public/index.html NON viene ripristinato: e' lo scheletro con la
          # data di oggi, eventualmente gia' riempito a meta'. Il secondo
          # tentativo riparte da li' e completa quello che manca.
          mkdir -p .cache
          cp public/index.html .cache/primo-tentativo.html 2>/dev/null || true

      - name: Rigenera l'edizione con Claude
        if: steps.primo_controllo.outcome == 'failure'
        uses: anthropics/claude-code-action@v1.0.222
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            ${{ env.PROMPT_EDIZIONE }}

            ## Nota su questo tentativo

            Il tentativo precedente non ha superato il controllo automatico.
            Comincia leggendo `.cache/esito-controllo.txt`: elenca i problemi
            trovati, compreso quante voci di `[NOTIZIE]` hanno già un riquadro.

            `public/index.html` è rimasto com'era: non è stato ripristinato.
            Quello che c'è dentro è lavoro buono, va completato, non rifatto.
            Rileggilo, capisci quali categorie mancano e aggiungi solo quelle,
            sempre un riquadro alla volta.

            Questa è l'ultima possibilità: quello che a fine turno si trova in
            `public/index.html` è ciò che viene pubblicato. Anche un'edizione
            con qualche riquadro in meno viene messa online: l'unico esito da
            evitare è una pagina senza notizie.
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "WebSearch,WebFetch,Read,Write,Edit,Glob,Grep,TodoWrite,Bash(date*)"
          # Il primo tentativo e' gia' andato male: qui serve poter leggere
          # nel log che cosa ha fatto l'agente, non solo il risultato.
          show_full_output: true

      - name: Verifica l'edizione generata
        id: controllo_finale
        run: .github/scripts/verifica-edizione.sh --minimo

      - name: Conserva l'edizione non valida
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: edizione-non-valida
          path: |
            public/index.html
            .cache/primo-tentativo.html
            .cache/esito-controllo.txt
          # .cache/ e' una cartella nascosta: senza questo flag i due file di
          # diagnostica verrebbero saltati.
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Pubblica l'edizione
        id: pubblica
        env:
          RAMO: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A public
          if git diff --staged --quiet; then
            echo "Nessuna modifica da pubblicare."
            echo "pubblicata=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Edizione del $(TZ='Europe/Rome' date +%d/%m/%Y)"

          # Il job pubblica solo public/, ormai committato: qualsiasi altra
          # modifica rimasta nell'albero di lavoro non va pubblicata e
          # impedirebbe il rebase piu' sotto.
          if ! git diff --quiet; then
            echo "::warning::scartate modifiche fuori da public/:"
            git diff --name-only
            git checkout -- .
          fi

          # Il checkout risale all'inizio del job: se nel frattempo qualcuno
          # ha spinto su ${RAMO}, il push viene rifiutato. Invece di fallire,
          # si rimette il commit dell'edizione in cima ai commit remoti
          # (rebase) e si riprova, senza sovrascrivere il lavoro altrui.
          for tentativo in 1 2 3 4 5; do
            if git push origin "HEAD:${RAMO}"; then
              echo "pubblicata=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Push rifiutato (tentativo ${tentativo}/5): riallineo con origin/${RAMO}."
            git fetch origin "${RAMO}"

            if ! git rebase "origin/${RAMO}"; then
              # L'unico file scritto dal job e' public/index.html: se il
              # conflitto e' li', l'edizione appena generata e' quella buona.
              # Qualsiasi conflitto fuori da public/ non e' roba nostra:
              # meglio fermarsi che indovinare.
              conflitti="$(git diff --name-only --diff-filter=U)"
              if [ -z "$conflitti" ] || printf '%s\n' "$conflitti" | grep -qv '^public/'; then
                echo "::error::conflitto non risolvibile in automatico durante il rebase:"
                printf '%s\n' "$conflitti"
                git rebase --abort || true
                exit 1
              fi

              printf '%s\n' "$conflitti" | while IFS= read -r file; do
                git checkout --theirs -- "$file" || git rm -f -- "$file"
              done
              git add -A public

              if git diff --cached --quiet; then
                # Il remoto contiene gia' la stessa edizione: niente da rifare.
                GIT_EDITOR=true git rebase --skip
                echo "L'edizione era gia' presente su origin/${RAMO}."
                echo "pubblicata=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              GIT_EDITOR=true git rebase --continue
            fi

            # Se il rebase ha svuotato il commit non resta nulla da spingere.
            if git diff --quiet "origin/${RAMO}" HEAD; then
              echo "Nessuna differenza rispetto a origin/${RAMO} dopo il rebase."
              echo "pubblicata=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            sleep $(( tentativo * 5 ))
          done

          echo "::error::push su ${RAMO} non riuscito dopo 5 tentativi."
          exit 1

      - name: Avvisa su Telegram
        if: steps.pubblica.outputs.pubblicata == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_CHAT: ${{ secrets.TELEGRAM_BOT_CHAT }}
          RIQUADRI: ${{ steps.controllo_finale.outputs.riquadri }}
          ATTESI: ${{ steps.controllo_finale.outputs.attesi }}
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_BOT_CHAT:-}" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN o TELEGRAM_BOT_CHAT non configurati: notifica saltata."
            exit 0
          fi

          # Attesa per lasciare a Cloudflare Pages il tempo di pubblicare.
          echo "Attendo ${ATTESA_DEPLOY_SECONDI}s prima di notificare..."
          sleep "${ATTESA_DEPLOY_SECONDI}"

          messaggio="La rassegna del $(TZ='Europe/Rome' date +%d/%m/%Y) e' pronta: ${SITO_URL}"

          # Un'edizione incompleta viene pubblicata lo stesso: il job resta
          # verde, quindi l'unico modo per accorgersene e' dirlo qui.
          if [ -n "${RIQUADRI:-}" ] && [ -n "${ATTESI:-}" ] && [ "${RIQUADRI}" -lt "${ATTESI}" ]; then
            messaggio="${messaggio} (edizione ridotta: ${RIQUADRI} riquadri su ${ATTESI})"
          fi

          curl -sS --fail-with-body -o /dev/null \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_BOT_CHAT}" \
            --data-urlencode "text=${messaggio}" \
            --data-urlencode "disable_web_page_preview=false"

          echo "Notifica Telegram inviata."


name: Rassegna stampa giornaliera

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

concurrency:
  group: rassegna-giornaliera
  cancel-in-progress: true

jobs:
  rassegna:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Genera la rassegna con Claude
        uses: anthropics/claude-code-action@v1.0.210
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Sei il redattore automatico del repository italian_news.
            Oggi è il giorno indicato dal comando `date` sulla macchina.

            Devi riscrivere COMPLETAMENTE da zero due file Markdown, cercando
            sul web le notizie più rilevanti delle ultime 24 ore.

            ## 1. `news_global.md`
            Le principali notizie italiane e internazionali della giornata.
            Da 8 a 12 notizie, ordinate per rilevanza e raggruppate per
            sezione: Politica, Economia, Estero, Cronaca, Scienza e
            tecnologia, Cultura e sport. Ometti le sezioni senza notizie.
            Non voglio informazioni sul calcio a meno che non si tratti dei mondiali.

            ## 2. `news_san_lazzaro_di_savena.md`
            Le notizie riguardanti il comune di San Lazzaro di Savena (BO) e,
            se scarseggiano, l'area metropolitana di Bologna. Da 4 a 8
            notizie: cronaca locale, decisioni dell'amministrazione comunale,
            viabilità, eventi e iniziative in programma.

            ## Formato di entrambi i file
            - Titolo di primo livello con il nome dell'edizione e la data in
              formato esteso italiano (es. "Giovedì 6 agosto 2026").
            - Ogni notizia: titolo di terzo livello, seguito da un riassunto
              di 2-4 frasi e da un link alla fonte originale.
            - In fondo, una riga che ricorda che il testo è generato
              automaticamente da un'intelligenza artificiale e non è
              verificato da un redattore umano.

            ## Regole redazionali
            - Scrivi in italiano, con tono sobrio e informativo.
            - Riassumi sempre con parole tue: non copiare frasi dagli
              articoli originali e non riportare virgolettati estesi.
            - Cita solo notizie che hai effettivamente trovato tramite
              ricerca web, con la relativa fonte. Non inventare NULLA:
              se non trovi abbastanza notizie locali, scrivine meno.
            - Mantieni un registro neutrale sui temi politicamente
              controversi: riporta i fatti, non prendere posizione.
            - Limitati a scrivere i due file Markdown: non modificare altro
              nel repository (la pagina `index.html` viene rigenerata
              automaticamente da uno script) e non eseguire comandi git.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 80
            --allowedTools "WebSearch,WebFetch,Read,Write,Edit,Bash(date*)"

      - name: Genera la pagina HTML statica
        run: python3 build_site.py

      - name: Pubblica la rassegna
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news_global.md news_san_lazzaro_di_savena.md index.html
          if git diff --staged --quiet; then
            echo "Nessuna modifica da pubblicare."
          else
            git commit -m "Rassegna del $(TZ='Europe/Rome' date +%d/%m/%Y)"
            git push
          fi
